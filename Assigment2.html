<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 600px;
            width: 100%;
        }
        .header{
            height: 20%;
            width: 100%;
            border: 1px solid blue;
            background-color: aqua;
        }
        .futer{
            height: 20%;
            width: 100%;
            border: 1px solid blue;
            background-color: aqua;
        }
        .mid{
            height:20%;
            width: 100%;
            display: flex;
            
        }
        .mid1{
            height:100%;
            width: 30%;
            border: 1px solid black;
            background-color: green;
        }
        .mid2{
            height: 100%;
            width: 70%;
            border: 1px solid black;
            /* display: flex; */
            background-color: rebeccapurple;
        }
        .b1,.b2{
            height: 100%;
            width: 50%;
            border: 1px solid black;
            display:flex ;
            background-color: red;


        }
        .midchild1{
            height: 30%;
            width: 100%;
            border: 1px solid black;
            /* display: flex;
            gap: 20px; */ 
        }
        .midchild2{
            height: 70%;
            width: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: space-evenly; 
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header"></div>
            <div class="mid">
            <div class="mid1">
                    <!-- <div class="con b1"></div> -->
                        </div>
            <div class="mid2">
                <div class="midchild1"></div>
                <div class="midchild2">
                    <div class="b1"></div>
                    <div class="b2"></div>
                </div>
            </div>
        </div>
            <div class="futer"></div>
</div>
</body>
</html>
